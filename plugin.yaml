name: codex-theme
version: "1.2.0"
description: "Codex × ChatGPT inspired theme for the Hermes Desktop chat — dual light/dark palettes that follow the system appearance, graphite-on-paper typography with a 1.625 root line height (aligned to ZCode) and content-spacing presets (1.5/1.625/1.75), the OpenAI radius scale (inline 4px / rows 8px / controls 10px / cards 12px / composer 20px), hairline borders, and a bilingual Settings page (appearance mode, 768/880/992px reading width, text & code font presets, user/assistant chat bubble colors, zh/en language, GitHub Issues feedback)."
author: "hey-yx"
requires_hermes: ">=0.22.0"
